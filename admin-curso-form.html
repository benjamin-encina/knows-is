  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo curso — Admin Knows-IS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="navbar-brand"><span class="brand-mark">&lt;/&gt;</span> Knows-IS</div>
      <a href="admin-home.html" class="admin-nav-link"><i class="bi bi-grid"></i> Dashboard</a>
      <a href="admin-cursos.html" class="admin-nav-link active"><i class="bi bi-mortarboard"></i> Cursos</a>
      <a href="admin-usuarios.html" class="admin-nav-link"><i class="bi bi-people"></i> Usuarios</a>
      <div class="admin-nav-divider">
        <a href="#" class="admin-nav-link"><i class="bi bi-gear"></i> Configuración</a>
        <a href="index.html" class="admin-nav-link"><i class="bi bi-box-arrow-left"></i> Salir al sitio</a>
      </div>
    </aside>

    <div class="admin-main">
      <div class="admin-topbar">
        <h1>Nuevo curso</h1>
        <a href="admin-cursos.html" class="link-tech small">← Volver al listado</a>
      </div>

      <div class="admin-content">
        <!--
          Esta misma vista sirve para "Nuevo curso" y "Editar curso":
          si viene un id por parámetro se precargan los campos.
          Validación en tiempo real con JavaScript en js/validaciones.js.
        -->
        <div id="cursoAlertOk" class="alert alert-success d-none" role="alert" style="max-width: 760px;">
          <i class="bi bi-check-circle me-1"></i> Curso guardado correctamente (simulado, sin conexión a base de datos todavía).
        </div>

        <form class="form-tech admin-card p-4" id="formCurso" style="max-width: 760px;" novalidate>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="codigo" class="form-label">Código del curso</label>
              <input type="text" class="form-control" id="codigo" name="codigo" minlength="3" required />
              <div class="invalid-feedback" id="err-codigo"></div>
            </div>
            <div class="col-md-8 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" required />
              <div class="invalid-feedback" id="err-nombre"></div>
            </div>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" maxlength="500"></textarea>
            <div class="invalid-feedback" id="err-descripcion"></div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="precio" class="form-label">Precio</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="precio" name="precio" min="0" step="1000" required />
              </div>
              <div class="invalid-feedback" id="err-precio"></div>
              <div class="form-hint">0 se considera curso gratuito.</div>
            </div>
            <div class="col-md-4 mb-3">
              <label for="cupos" class="form-label">Cupos</label>
              <input type="number" class="form-control" id="cupos" name="cupos" min="25" step="1" required />
              <div class="invalid-feedback" id="err-cupos"></div>
            </div>
            <div class="col-md-4 mb-3">
              <label for="cupo_critico" class="form-label">Cupo crítico <span class="text-muted">(opcional)</span></label>
              <input type="number" class="form-control" id="cupo_critico" name="cupo_critico" min="0" step="1" />
              <div class="invalid-feedback" id="err-cupo_critico"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select class="form-select" id="categoria" name="categoria" required>
                <option selected disabled value="">Seleccione una categoría</option>
                <option>Programación</option>
                <option>Redes</option>
                <option>Diseño digital</option>
                <option>Ciberseguridad</option>
                <option>Datos</option>
                <option>Inteligencia Artificial</option>
              </select>
              <div class="invalid-feedback" id="err-categoria"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="nivel" class="form-label">Nivel</label>
              <select class="form-select" id="nivel" name="nivel" required>
                <option selected disabled value="">Seleccione un nivel</option>
                <option>Inicial</option>
                <option>Intermedio</option>
                <option>Avanzado</option>
              </select>
              <div class="invalid-feedback" id="err-nivel"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="instructor" class="form-label">Instructor</label>
              <select class="form-select" id="instructor" name="instructor" required>
                <option selected disabled value="">Seleccione un instructor</option>
                <option>Kevin Soto</option>
                <option>Benjamín Rojas</option>
              </select>
              <div class="invalid-feedback" id="err-instructor"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="imagen" class="form-label">Imagen <span class="text-muted">(opcional)</span></label>
              <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*" />
              <div class="invalid-feedback" id="err-imagen"></div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-tech-primary">Guardar curso</button>
            <a href="admin-cursos.html" class="btn btn-tech-outline">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
